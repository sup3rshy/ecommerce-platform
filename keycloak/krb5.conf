[libdefaults]
  default_realm = ECOMMERCE.LOCAL
  dns_lookup_realm = false
  dns_lookup_kdc = false
  ticket_lifetime = 24h
  renew_lifetime = 7d
  forwardable = true
  rdns = false

[realms]
  ECOMMERCE.LOCAL = {
    kdc = 192.168.1.50
    admin_server = 192.168.1.50
  }

[domain_realm]
  .ecommerce.local = ECOMMERCE.LOCAL
  ecommerce.local = ECOMMERCE.LOCAL
