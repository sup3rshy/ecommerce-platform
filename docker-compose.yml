services:
  # === Postgres dành riêng cho Keycloak (nội bộ, không expose) ===
  postgres-keycloak:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    # KHÔNG expose port: Keycloak nói chuyện qua docker network thôi.

  # === Postgres dành cho ecommerce / seller_workspace / shoppay ===
  postgres-app:
    image: postgres:15
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
      - ./scripts/init-app-dbs.sql:/docker-entrypoint-initdb.d/init-app-dbs.sql:ro

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    entrypoint: ["/bin/bash", "/custom-entrypoint.sh"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Client secrets — realm.json reference các biến này qua ${VAR_NAME}
      NEXTJS_APP_CLIENT_SECRET: ${NEXTJS_APP_CLIENT_SECRET}
      SELLER_WORKSPACE_CLIENT_SECRET: ${SELLER_WORKSPACE_CLIENT_SECRET}
      SHOPPAY_CLIENT_SECRET: ${SHOPPAY_CLIENT_SECRET}
      BACKEND_ADMIN_CLIENT_SECRET: ${BACKEND_ADMIN_CLIENT_SECRET}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      GOOGLE_IDP_CLIENT_ID: ${GOOGLE_IDP_CLIENT_ID}
      GOOGLE_IDP_CLIENT_SECRET: ${GOOGLE_IDP_CLIENT_SECRET}
    ports:
      - "8080:8080"
    volumes:
      # Keycloak directory-import yêu cầu tên file = {realm-name}-realm.json
      - ./keycloak/ecommerce-realm.json:/opt/keycloak/data/import-template/ecommerce-realm-realm.json:ro
      - ./keycloak/acme-corp-realm.json:/opt/keycloak/data/import-template/acme-corp-realm-realm.json:ro
      - ./keycloak/entrypoint.sh:/custom-entrypoint.sh:ro
    depends_on:
      - postgres-keycloak

  # === FreeIPA — Domain Controller (LDAP + Kerberos) ===
  # Heavy infra, KHÔNG tự start với `compose up` thường.
  # Chạy có chủ ý: docker compose --profile domain up -d freeipa
  # Mất ~5-10 phút lần đầu provision. RAM ~1-1.5GB.
  # Sau khi up, vào Keycloak Admin Console wire LDAP federation (xem README).
  freeipa:
    image: freeipa/freeipa-server:rocky-9
    profiles: ["domain"]
    hostname: ipa.example.test
    environment:
      IPA_SERVER_IP: 127.0.0.1
    command:
      - "ipa-server-install"
      - "--unattended"
      - "--realm=EXAMPLE.TEST"
      - "--domain=example.test"
      - "--ds-password=DirectoryManager@2024"
      - "--admin-password=Admin@2024"
      - "--no-ntp"
      - "--no-host-dns"
    ports:
      - "389:389"     # LDAP (cho Keycloak federation)
      - "636:636"     # LDAPS
      - "443:443"     # FreeIPA web UI
      - "88:88/tcp"   # Kerberos KDC
      - "88:88/udp"
    volumes:
      - freeipa_data:/data
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    cap_add:
      - SYS_TIME
    restart: unless-stopped

  nginx:
    image: nginx:1.27
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - keycloak
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_keycloak_data:
  postgres_app_data:
  freeipa_data:
