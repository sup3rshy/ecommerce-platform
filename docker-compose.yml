services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    entrypoint: ["/bin/bash", "/custom-entrypoint.sh"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Client secrets — realm.json reference các biến này qua ${VAR_NAME}
      NEXTJS_APP_CLIENT_SECRET: ${NEXTJS_APP_CLIENT_SECRET}
      SELLER_WORKSPACE_CLIENT_SECRET: ${SELLER_WORKSPACE_CLIENT_SECRET}
      SHOPPAY_CLIENT_SECRET: ${SHOPPAY_CLIENT_SECRET}
      BACKEND_ADMIN_CLIENT_SECRET: ${BACKEND_ADMIN_CLIENT_SECRET}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      # Mount template (chứa ${VAR}) sang đường dẫn trung gian; entrypoint sẽ resolve
      # rồi ghi ra /opt/keycloak/data/import/realm.json để Keycloak import.
      - ./keycloak/ecommerce-realm.json:/opt/keycloak/data/import-template/realm.json:ro
      - ./keycloak/entrypoint.sh:/custom-entrypoint.sh:ro
    depends_on:
      - postgres

  nginx:
    image: nginx:1.27
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - keycloak
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
